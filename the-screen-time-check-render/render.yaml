services:
  - type: web
    name: static-check
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    disk:
      name: leads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.11.9"
